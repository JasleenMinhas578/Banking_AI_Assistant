# Demo customers for Puffin Bank. All data is fictional.
# Amounts are in cents. Dates are "days_ago" so data always looks recent.

customers:
  - code: C-1001
    name: Priya Sharma
    pin: "2468"            # hashed by the seed script, never stored as-is
    story: Everyday customer, healthy balances
    accounts:
      - type: chequing
        last4: "4821"
        balance_cents: 324050
        card_last4: "9012"
        transactions:
          - { merchant: Costco, amount_cents: -18432, days_ago: 2 }
          - { merchant: Tim Hortons, amount_cents: -645, days_ago: 1 }
