# Our own services. The database is started separately by the Supabase CLI
# (`make db`), so the two never fight over Postgres. Ollama runs natively on
# macOS (no GPU inside Docker on a Mac) and is added in later phases.
services:
  bank_api:
    build: ./services/bank_api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Inside a container, 127.0.0.1 means the container itself.
      # host.docker.internal reaches your Mac, where Supabase is listening.
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  mcp_server:
    build: ./services/mcp_server
    ports:
      - "8100:8100"
    env_file:
      - path: .env
        required: false
    environment:
      # Containers reach each other by service name on Compose's network.
      BANK_API_URL: http://bank_api:8000
      # Listen on all interfaces inside the container, so the port mapping works.
      MCP_HOST: 0.0.0.0
      # Never use a shared dev token in a container.
      BANK_SESSION_TOKEN: ""
    depends_on:
      - bank_api
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    ports:
      - "8200:8200"
    env_file:
      - path: .env
        required: false
    environment:
      BANK_API_URL: http://bank_api:8000
      MCP_URL: http://mcp_server:8100/mcp
      # Ollama runs natively on the Mac; the container reaches it through the host.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mcp_server
    restart: unless-stopped
